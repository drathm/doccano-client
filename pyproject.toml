[tool.poetry]
name = "doccano-client"
version = "1.2.8"
description = "A simple client for doccano API."
authors = ["Hironsan <hiroki.nakayama.py@gmail.com>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/doccano/doccano-client"
repository = "https://github.com/doccano/doccano-client"
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
]
packages = [{include = "doccano_client"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.14"
requests = ">=2.31,<3"
spacy = { version = "^3.4.1", optional = true }
spacy-partial-tagger = { version = "^0.9.1", optional = true }
tqdm = { version = ">=4.66,<5", optional = true }
pydantic = ">=2,<3"
requests-toolbelt = ">=1.0.0,<2"
ffmpeg-python = { version = "^0.2.0", optional = true }
seqal = { version = "^0.3.4", optional = true }
pyyaml = ">=6.0.1"
dataclasses-json = ">=0.6,<1"

[tool.poetry.group.dev.dependencies]
flake8 = ">=7.0.0,<8"
isort = ">=5.13.2,<6"
mypy = ">=1.7,<2"
darglint = "^1.8.1"
black = ">=24.4.0,<25"
responses = ">=0.25.0,<1"
types-requests = ">=2.31.0,<3"
pytest = ">=7.4,<9"
taskipy = "^1.10.3"
vcrpy = "^4.2.1"
multidict = ">=6.1,<7"
yarl = ">=1.9.4,<2"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
mkdocs = ">=1.6,<2"
mkdocs-material = ">=9.5,<10"
mkdocs-same-dir = "^0.1.1"
mkdocstrings = ">=0.25,<1"
mkdocstrings-python = ">=1.10,<2"
multidict = ">=6.1,<7"

[tool.poetry.extras]
spacy = ["spacy", "spacy-partial-tagger", "tqdm"]
whisper = ["ffmpeg-python", "tqdm"]
al = ["spacy", "seqal"]

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.scripts]
docli = 'doccano_client.cli.commands:main'

[tool.black]
line-length = 120
target-version = ['py311', 'py312', 'py313']
include = '\.pyi?$'

[tool.flake8]
max-line-length = 120
max-complexity = 18
ignore = "E203,E266,W503"
filename = "*.py"
exclude = ".git,__pycache__,docs,build,dist,doccano_client/beta"

[tool.isort]
profile = "black"
include_trailing_comma = true
multi_line_output = 3

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
show_error_codes = true
no_implicit_optional = false
exclude = [
    'doccano_client/beta',
]

[tool.taskipy.tasks]
isort = "isort . -c"
flake8 = "flake8 doccano_client"
black = "black --check ."
darglint = "darglint"
mypy = "mypy doccano_client"
test = "python -m pytest"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
